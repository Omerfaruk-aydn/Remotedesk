services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureremotedesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secureremotedesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: ./apps/backend-api
      dockerfile: ../../infra/docker/backend-api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=secureremotedesk;Username=postgres;Password=postgres
      Jwt__AccessSecret: dev-only-change-this-access-secret-32chars
      Jwt__RefreshSecret: dev-only-change-this-refresh-secret-32chars
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
      dockerfile: ../../infra/docker/admin-dashboard.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SIGNALING_URL: http://localhost:8080/hubs/signaling
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

  coturn:
    image: coturn/coturn:4.6
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

volumes:
  postgres-data:
